services:
  db:
    image: postgres:16
    container_name: mysocialsite-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - mysocialsite_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: mysocialsite-web
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      ALLOWED_HOSTS: 127.0.0.1,localhost
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - ./bookmarks/media:/app/bookmarks/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysocialsite_pgdata:
