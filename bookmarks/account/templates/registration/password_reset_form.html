{% extends "base.html" %}
{% block title %}Сброс пароля{% endblock %}

{% block content %}
<main class="auth">
    <section class="auth-card">
        <h1>Сброс пароля</h1>
        <p class="auth-lead">Используйте форму ниже для сброса пароля.</p>
        <form class="auth-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Сбросить пароль</button>
        </form>
    </section>
</main>
{% endblock %}
