{% extends "base.html" %}
{% load static %}

{% block title %}Изображения{% endblock %}

{% block content %}
<main class="page page-images">
    <h1>Изображения</h1>
    <div id="image-list" class="image-list">
        {% include "images/image/list_images.html" %}
    </div>
    {% if not images %}
        <p class="image-list-empty">Пока нет изображений</p>
    {% endif %}
</main>
{% endblock %}

{% block extra_js %}
    <script src="{% static 'js/image-list.js' %}" defer></script>
{% endblock %}
